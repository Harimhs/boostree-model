<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commit X-ray</title>
<meta name="description" content="Predicts which code commits will cause bugs. Delay-aware gradient boosting on a frozen network, real Apache data.">
<style>
:root {
  color-scheme: light;
  --page: #f6f6f4; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.08);
  --ours: #2a78d6; --naive: #eb6834; --oracle: #6f6d66; --base: #a9a79f;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --crit: #d03b3b;
  --hero-a: #3b2fc9; --hero-b: #2a78d6; --hero-c: #13a6a0;
  --ours-soft: #e3eefc; --naive-soft: #fdeae2; --oracle-soft: #e1f6ee; --warn-soft: #fff3d6; --crit-soft: #fbe3e3; --good-soft: #e2f5e2;
  --shadow: 0 1px 2px rgba(20,20,60,.06), 0 8px 24px rgba(20,20,60,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d10; --card: #1a1a1d; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.08);
    --ours: #3987e5; --naive: #d95926; --oracle: #b3b1a8; --base: #6c6a64;
    --good-text: #0ca30c;
    --hero-a: #2a2296; --hero-b: #1c5cab; --hero-c: #0e7f7a;
    --ours-soft: #16263d; --naive-soft: #35201a; --oracle-soft: #13302a; --warn-soft: #3a2f12; --crit-soft: #3a1a1a; --good-soft: #142e14;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d10; --card: #1a1a1d; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.08);
  --ours: #3987e5; --naive: #d95926; --oracle: #b3b1a8; --base: #6c6a64;
  --good-text: #0ca30c;
  --hero-a: #2a2296; --hero-b: #1c5cab; --hero-c: #0e7f7a;
  --ours-soft: #16263d; --naive-soft: #35201a; --oracle-soft: #13302a; --warn-soft: #3a2f12; --crit-soft: #3a1a1a; --good-soft: #142e14;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 15.5px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
@media (min-width: 980px) {
  .wrap { max-width: 1060px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
}
/* hero */
.hero { margin: 16px 0 0; padding: 20px 18px; color: var(--ink); border-radius: 18px; background: var(--card);
  border: 1px solid var(--ring); border-top: 4px solid var(--ours); }
.hero .tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--ours); }
.hero .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.hero h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 12px 0 6px; }
.hero p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pills span { font-size: 12px; background: var(--page); color: var(--ink-2); padding: 3px 9px; border-radius: 99px; }
/* kpis */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
@media (min-width: 980px) { .kpis { grid-template-columns: repeat(4, 1fr); margin-top: 16px; } }
.kpi { background: var(--card); border-radius: 16px; padding: 12px 12px 11px; box-shadow: var(--shadow); border: 1px solid var(--ring); }
.kpi .v { color: var(--c, var(--ink)); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi .l { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.3; }
/* cards */
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 18px; padding: 18px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.card h2 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
.small { font-size: 12.5px; color: var(--muted); }
/* with vs without */
.cmp { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--page); border: 1px solid transparent; }
.row .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.row .name i { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.row .val { font-weight: 700; font-size: 15px; text-align: right; }
.row .meter { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.row .meter b { display: block; height: 100%; border-radius: 99px; }
.row .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.row.hl { background: var(--ours-soft); border-color: var(--ours); }
.row.bad { background: var(--page); }
.delta { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; margin-left: 4px; }
.delta.up { background: var(--good-soft); color: var(--good-text); }
.delta.down { background: var(--crit-soft); color: var(--crit); }
.metric-toggle, .tabs { display: flex; gap: 4px; background: var(--page); padding: 4px; border-radius: 12px; margin-bottom: 12px; overflow-x: auto; }
.metric-toggle button, .tabs button { flex: 1 0 auto; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.metric-toggle button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .lbl { font-size: 11.5px; font-weight: 600; fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--ring); box-shadow: 0 6px 20px rgba(0,0,0,.18);
  border-radius: 10px; padding: 7px 9px; font-size: 12px; min-width: 120px; opacity: 0; transition: opacity .1s; z-index: 2; }
.tip b { display: block; margin-bottom: 3px; }
.tip div { display: flex; justify-content: space-between; gap: 10px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 8px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--base) 0 4px, transparent 4px 7px) !important; }
.caption { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
/* samples */
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 4px 0 6px; }
.stack b { display: block; height: 100%; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
.keys span { display: inline-flex; gap: 6px; align-items: center; }
.keys i { width: 10px; height: 10px; border-radius: 3px; }
.samples { display: grid; gap: 8px; }
.sample { border: 1px solid var(--ring); border-left: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; }
.sample .t { font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.sample .m { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.treat { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.treat div { font-size: 12px; padding: 6px 8px; border-radius: 8px; background: var(--page); line-height: 1.35; }
.treat div b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 1px; }
.treat .wrong { color: var(--naive); font-weight: 600; }
.treat .right { background: var(--ours-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.chip.crit { background: var(--page); color: var(--ink); border: 1px solid var(--ring); }
.chip.warn { background: var(--ours-soft); color: var(--ours); }
:root[data-theme="dark"] .chip.warn { color: var(--ours); }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .chip.warn { color: var(--ours); } }
.chip.good { background: var(--page); color: var(--ink-2); border: 1px solid var(--ring); }
.more { margin-top: 10px; width: 100%; border: 1px dashed var(--axis); background: transparent; color: var(--ours); font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px; border-radius: 12px; cursor: pointer; }
.hidden { display: none !important; }
/* commits */
.commit { border: 1px solid var(--ring); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.commit + .commit { margin-top: 8px; }
.commit .top { display: flex; gap: 10px; align-items: center; }
.risk { flex: 0 0 auto; min-width: 50px; text-align: center; font-weight: 800; font-size: 14px; padding: 6px 6px; border-radius: 10px; }
.risk { border: 1px solid var(--ring); } .risk.hi { color: var(--crit); } .risk.mid { color: var(--ink); } .risk.lo { color: var(--good-text); }
.commit .t { font-size: 13.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.commit .p { font-size: 12px; color: var(--muted); }
.commit .d { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--ring); }
.commit.open .d { display: block; }
.why { display: grid; gap: 4px; font-size: 13px; }
.why div { display: flex; justify-content: space-between; gap: 8px; }
.why .up { color: var(--crit); font-weight: 700; } .why .dn { color: var(--good-text); font-weight: 700; }
.reveal { margin-top: 10px; width: 100%; padding: 9px; border-radius: 10px; border: 1px solid var(--ours); background: transparent; color: var(--ours); font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.truth { display: none; margin-top: 8px; font-size: 13px; padding: 9px 10px; border-radius: 10px; }
.truth.show { display: block; } .truth.bug, .truth.ok { background: var(--page); }
.truth a { color: var(--ours); }
/* details */
details { border-top: 1px solid var(--ring); padding: 2px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; list-style: none; padding: 12px 0; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 18px; color: var(--ours); }
details[open] summary::after { content: "–"; }
details .body { padding: 0 0 12px; font-size: 13.5px; color: var(--ink-2); }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--page); border-radius: 10px; padding: 10px 12px; white-space: pre; overflow-x: auto; color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 6px 4px; border-bottom: 1px solid var(--ring); text-align: left; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
ol { padding-left: 18px; margin: 0; } li { margin: 4px 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="tag"><i></i> COMMIT X-RAY · RESEARCH DEMO</span>
    <h1>Spot the commit that will break production</h1>
    <p>Bug-risk score for every code change, and a fix for the hidden problem: bugs are found months late, so models retrained on recent data learn wrong labels.</p>
    <div class="pills"><span>Real Apache commits</span><span>From-scratch boosting</span><span>Frozen network</span><span>CPU only</span></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="cols">
    <div>
      <section class="card" id="compare"></section>
      <section class="card" id="trends"></section>
    </div>
    <div>
      <section class="card" id="samples"></section>
      <section class="card" id="commits"></section>
      <section class="card" id="details"></section>
    </div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sign = (x, d = 3) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);

/* ---------- generic line chart with crosshair tooltip ---------- */
function lineChart(host, { series, xLabels, yFmt = (v) => v.toFixed(3), yMin, yMax, refLine, height = 200, xTitle }) {
  const W = 340, H = height, L = 40, R = 46, T = 10, B = 28;
  const n = xLabels.length;
  const all = series.flatMap((s) => s.values.filter((v) => v != null)).concat(refLine ? [refLine.value] : []);
  const lo = yMin ?? Math.min(...all), hi = yMax ?? Math.max(...all);
  const pad = (hi - lo) * 0.12 || 0.01;
  const y0 = lo - pad, y1 = hi + pad;
  const X = (i) => L + (n === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (n - 1));
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = 4, tv = [...Array(ticks + 1)].map((_, i) => y0 + ((y1 - y0) * i) / ticks);
  let g = tv.map((v) => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`).join("");
  const step = Math.max(1, Math.ceil(n / 7));
  g += xLabels.map((l, i) => (i % step === 0 || i === n - 1) ? `<text x="${X(i)}" y="${H - 9}" text-anchor="middle">${l}</text>` : "").join("");
  g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  if (refLine) g += `<line x1="${L}" x2="${W - R}" y1="${Y(refLine.value)}" y2="${Y(refLine.value)}" stroke="var(--base)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const labels = [];
  for (const s of series) {
    const pts = s.values.map((v, i) => (v == null ? null : [X(i), Y(v)])).filter(Boolean);
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;
    const last = pts[pts.length - 1];
    g += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
    if (s.label) labels.push({ x: last[0] + 7, y: last[1] + 4, t: s.label });
  }
  // nudge end labels apart so they never overlap
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) {
    const prev = labels[i - 1], cur = labels[i];
    if (Math.abs(cur.x - prev.x) < 40 && cur.y - prev.y < 13) cur.y = prev.y + 13;
  }
  g += labels.map((l) => `<text class="lbl" x="${l.x}" y="${l.y}">${l.t}</text>`).join("");
  g += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;
  g += series.map((s, k) => `<circle class="dot${k}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2" opacity="0"/>`).join("");
  g += `<rect x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}" fill="transparent" class="hit"/>`;
  host.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(xTitle || "chart")}">${g}</svg><div class="tip"></div></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), cross = svg.querySelector(".cross");
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * W;
    let i = n === 1 ? 0 : Math.round(((sx - L) / (W - L - R)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
    series.forEach((s, k) => {
      const d = svg.querySelector(".dot" + k), v = s.values[i];
      if (v == null) { d.setAttribute("opacity", 0); return; }
      d.setAttribute("cx", X(i)); d.setAttribute("cy", Y(v)); d.setAttribute("opacity", 1);
    });
    tip.innerHTML = `<b>${esc(xTitle ? xTitle + ": " : "")}${esc(xLabels[i])}</b>` + series.map((s) => s.values[i] == null ? "" :
      `<div><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span>${yFmt(s.values[i])}</span></div>`).join("") +
      (refLine ? `<div><span><i style="background:var(--base)"></i>${esc(refLine.name)}</span><span>${yFmt(refLine.value)}</span></div>` : "");
    const px = (X(i) / W) * r.width;
    tip.style.left = Math.min(Math.max(0, px - 70), r.width - 150) + "px";
    tip.style.top = "-6px"; tip.style.opacity = 1;
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); series.forEach((_, k) => svg.querySelector(".dot" + k).setAttribute("opacity", 0)); });
}

function barChart(host, { labels, values, colors, yFmt = (v) => pct(v), height = 180, notes = {} }) {
  const W = 340, H = height, L = 8, R = 8, T = 18, B = 24, n = labels.length;
  const max = Math.max(...values) * 1.15, bw = (W - L - R) / n;
  let g = `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  values.forEach((v, i) => {
    const h = (v / max) * (H - T - B), x = L + i * bw + bw * 0.16, w = bw * 0.68;
    g += `<path d="M${x},${H - B} v${-(h - 4)} q0,-4 4,-4 h${w - 8} q4,0 4,4 v${h - 4} z" fill="${colors[i]}"><title>${labels[i]}: ${yFmt(v)}${notes[i] ? " · " + notes[i] : ""}</title></path>`;
    g += `<text x="${x + w / 2}" y="${H - B - h - 5}" text-anchor="middle" class="lbl">${yFmt(v)}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
  });
  host.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="bar chart">${g}</svg></div>`;
}

/* ---------- sections ---------- */
function kpis(D, Rs) {
  const M = Rs.adapt.mean, k = [
    [pct(D.models.ours.recall_top20), "of bug-causing commits caught by reviewing the riskiest 20%", "var(--ink)"],
    [sign(M["boosters delay (ours)"].auc - M["boosters naive"].auc, 3), `AUC, delay-aware vs naive adaptation · wins ${Rs.adapt.wins.delay_vs_naive_auc}/${Rs.adapt.n_runs}`, "var(--ours)"],
    [Rs.delay.median_days + " d", "median time until a bug is found", "var(--ink)"],
    ["≈ " + pct(1 - Rs.recent_year.reduce((a, y) => a + y.known / y.final, 0) / Rs.recent_year.length), "of last year's bugs still hidden when you retrain", "var(--ink)"],
  ];
  $("#kpis").innerHTML = k.map(([v, l, c]) => `<div class="kpi" style="--c:${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

function compare(Rs) {
  const M = Rs.adapt.mean, f = M["frozen net"];
  const rows = [
    { key: "frozen net", name: "Frozen network (no update)", color: "var(--base)", cls: "", note: "Starting point. Weights locked." },
    { key: "boosters naive", name: "Without: plain gradient + hessian", color: "var(--naive)", cls: "bad", note: "Treats “no bug found yet” as clean, so it learns recent = safe." },
    { key: "boosters delay (ours)", name: "With: delay-aware + Fisher hessian", color: "var(--ours)", cls: "hl", note: "Treats young commits as “not known yet”, weighted by how likely a bug would have surfaced." },
    { key: "boosters oracle", name: "Ceiling: if future labels were known", color: "var(--oracle)", cls: "", note: "Impossible in practice; shows the room left." },
  ];
  let metric = "auc";
  const draw = () => {
    const vals = rows.map((r) => M[r.key][metric]), lo = Math.min(...vals) - (metric === "auc" ? 0.02 : 0.03), hi = Math.max(...vals) + 0.005;
    const fmt = (v) => (metric === "auc" ? v.toFixed(3) : pct(v, 1));
    $("#cmpRows").innerHTML = rows.map((r) => {
      const v = M[r.key][metric], d = v - f[metric];
      const dd = r.key === "frozen net" ? "" : `<span class="delta ${d >= 0 ? "up" : "down"}">${metric === "auc" ? sign(d) : (d >= 0 ? "+" : "−") + Math.abs(d * 100).toFixed(1) + " pts"}</span>`;
      return `<div class="row ${r.cls}"><span class="name"><i style="background:${r.color}"></i>${r.name}</span>
        <span class="val">${fmt(v)}${dd}</span>
        <span class="meter"><b style="width:${((v - lo) / (hi - lo)) * 100}%;background:${r.color}"></b></span>
        <span class="note">${r.note}</span></div>`;
    }).join("");
    document.querySelectorAll("#compare .metric-toggle button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === metric));
  };
  const gain = M["boosters delay (ours)"].auc - M["boosters naive"].auc;
  $("#compare").innerHTML = `
    <h2>With vs without the fix</h2>
    <p class="sub">A frozen network adapts on the latest year of commits, when about half its bugs are still undiscovered, and is tested on the next year. Average of ${Rs.adapt.n_runs} runs. Badges show the change from the frozen start.</p>
    <div class="metric-toggle" role="group"><button data-m="auc">AUC (ranking)</button><button data-m="recall_top20">Bugs caught in top 20%</button></div>
    <div class="cmp" id="cmpRows"></div>
    <p class="caption">Plain boosting makes the model <b style="color:var(--crit)">worse</b> than doing nothing. With the fix, adapting helps: <b>${sign(gain)} AUC over plain</b>, better in ${Rs.adapt.wins.delay_vs_naive_auc} of ${Rs.adapt.n_runs} runs.</p>`;
  document.querySelectorAll("#compare .metric-toggle button").forEach((b) => b.addEventListener("click", () => { metric = b.dataset.m; draw(); }));
  draw();
}

function trends(Dash, D) {
  const tabs = [
    ["adapt", "Adapting"], ["years", "By year"], ["train", "Training"], ["labels", "Hidden bugs"],
  ];
  $("#trends").innerHTML = `<h2>Trends</h2><p class="sub" id="trendSub"></p>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="legend" id="trendLegend"></div><div id="trendChart"></div><p class="caption" id="trendCap"></p>`;
  const C = { ours: css("--ours"), naive: css("--naive"), oracle: css("--oracle"), base: css("--base") };
  const legend = (items) => ($("#trendLegend").innerHTML = items.map(([n, c, dash]) => `<span><i class="${dash ? "dash" : ""}" style="background:${c}"></i>${n}</span>`).join(""));
  const show = (k) => {
    document.querySelectorAll("#trends .tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.k === k));
    const T = Dash.trajectory, host = $("#trendChart");
    if (k === "adapt") {
      const S = T.series, n = Math.max(...Object.values(S).map((s) => s.length));
      const vals = (s) => [...Array(n)].map((_, i) => (s[i] ? s[i].auc : null));
      $("#trendSub").textContent = `Test AUC after each booster is added to the frozen network (one run, test year ${T.test_year}).`;
      legend([["Ours (delay-aware)", C.ours], ["Plain (naive)", C.naive], ["Future labels (ceiling)", C.oracle], ["Frozen start", C.base, 1]]);
      lineChart(host, { xTitle: "boosters added", xLabels: [...Array(n)].map((_, i) => String(i)),
        series: [{ name: "Ours", color: C.ours, values: vals(S.ours), label: "ours" }, { name: "Plain", color: C.naive, values: vals(S.naive), label: "plain" },
                 { name: "Ceiling", color: C.oracle, values: vals(S.oracle), label: "ceiling" }],
        refLine: { name: "Frozen start", value: T.start.auc } });
      $("#trendCap").textContent = "The first plain booster drops the score at once, and line search stops it after a few rounds. Ours keeps adding small improvements.";
    } else if (k === "years") {
      const P = Dash.per_cutoff_auc, yrs = Object.keys(P["frozen net"]).sort();
      $("#trendSub").textContent = "Average AUC for each test year (adapt on the year before, test on this one).";
      legend([["Ours", C.ours], ["Plain", C.naive], ["Ceiling", C.oracle], ["Frozen", C.base]]);
      lineChart(host, { xTitle: "test year", xLabels: yrs,
        series: [{ name: "Ours", color: C.ours, values: yrs.map((y) => P["boosters delay (ours)"][y]), label: "ours" },
                 { name: "Plain", color: C.naive, values: yrs.map((y) => P["boosters naive"][y]), label: "plain" },
                 { name: "Ceiling", color: C.oracle, values: yrs.map((y) => P["boosters oracle"][y]), label: "ceiling" },
                 { name: "Frozen", color: C.base, values: yrs.map((y) => P["frozen net"][y]) }] });
      $("#trendCap").textContent = "Ours stays above plain every year. In 2017 plain adaptation hurt badly.";
    } else if (k === "train") {
      const P = Dash.tree_curve.points;
      $("#trendSub").textContent = "From-scratch boosting engine: test AUC as trees are added (train ≤2015, early-stop 2016, test 2017–2019).";
      legend([["Test AUC", C.ours]]);
      lineChart(host, { xTitle: "trees", xLabels: P.map((p) => String(p.trees)), series: [{ name: "Test AUC", color: C.ours, values: P.map((p) => p.test_auc) }] });
      $("#trendCap").textContent = `Stopped automatically at ${Dash.tree_curve.kept} trees, when validation loss stopped improving. Final AUC ${P[P.length - 1].test_auc.toFixed(3)}.`;
    } else {
      const B = Dash.bug_rate_by_year;
      $("#trendSub").textContent = "Share of commits labelled bug-causing, by year (as of the end of 2019).";
      legend([["Settled years", C.base], ["Recent: bugs not found yet", C.naive]]);
      barChart(host, { labels: B.map((b) => "'" + String(b.year).slice(2)), values: B.map((b) => b.rate), colors: B.map((b) => (b.year >= 2018 ? C.naive : C.base)) });
      $("#trendCap").textContent = "The drop in 2018–19 isn't better code. Those bugs simply hadn't been found yet.";
    }
  };
  document.querySelectorAll("#trends .tabs button").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
  show("adapt");
}

function samples(Dash) {
  const c = Dash.sample_counts, tot = c.adapt_commits;
  const crit = css("--ink-2"), warn = css("--ours"), good = css("--grid");
  const parts = [[c.known_buggy, crit, "bug already found"], [c.hidden_buggy, warn, "hidden bug (found later)"], [c.clean, good, "really clean"]];
  const card = (s) => {
    const col = !s.known_bug && s.final_bug ? "var(--ours)" : "var(--ring)";
    const status = s.known_bug ? `<span class="chip crit">● bug found</span>` : `<span class="chip warn">○ no bug found yet</span>`;
    const naive = s.known_bug ? "buggy ✓" : s.final_bug ? "clean ✗ (wrong)" : "clean ✓";
    const ours = s.known_bug ? "buggy ✓" : `not known yet, counts ${pct(s.q)} as clean`;
    const truth = s.final_bug ? `<span class="chip crit">bug found ${s.found_after_days} days later</span>` : `<span class="chip good">✓ stayed clean</span>`;
    return `<div class="sample" style="--c:${col}">
      <div class="t">${esc(s.title && !/^https?:/.test(s.title) ? s.title : "commit " + s.sha.slice(0, 8))}</div>
      <div class="m">${esc(s.project.replace("apache/", ""))} · ${s.date} · ${s.age_days} days old at training time · ${status}</div>
      <div class="treat"><div class="${!s.known_bug && s.final_bug ? "wrong" : ""}"><b>Plain treats as</b>${naive}</div><div class="right"><b>Ours treats as</b>${ours}</div></div>
      <div class="m" style="margin:8px 0 0">Later truth: ${truth}</div></div>`;
  };
  $("#samples").innerHTML = `<h2>Active training samples</h2>
    <p class="sub">What the model sees when it adapts: ${tot.toLocaleString()} commits from the latest year before ${Dash.trajectory.cutoff.slice(0, 4)}.</p>
    <div class="stack">${parts.map(([v, col, n]) => `<b style="width:${(v / tot) * 100}%;background:${col}" title="${n}: ${v.toLocaleString()}"></b>`).join("")}</div>
    <div class="keys">${parts.map(([v, col, n]) => `<span><i style="background:${col}"></i>${n} · ${v.toLocaleString()}</span>`).join("")}</div>
    <div class="samples">${Dash.samples.map((s, i) => `<div class="${i >= 3 ? "hidden extra" : ""}">${card(s)}</div>`).join("")}</div>
    <button class="more" type="button">Show ${Dash.samples.length - 3} more samples</button>`;
  const btn = $("#samples .more");
  btn.addEventListener("click", () => {
    const open = btn.dataset.open === "1";
    document.querySelectorAll("#samples .extra").forEach((e) => e.classList.toggle("hidden", open));
    btn.dataset.open = open ? "0" : "1";
    btn.textContent = open ? `Show ${Dash.samples.length - 3} more samples` : "Show fewer";
  });
}

function commits(D) {
  const lvl = (r) => (r >= 0.6 ? "hi" : r >= 0.3 ? "mid" : "lo");
  $("#commits").innerHTML = `<h2>Try it: real commits</h2>
    <p class="sub">2017–2019 commits the model never saw. Tap one, read the risk and why, then reveal what happened. Misses and false alarms are included.</p>
    <div id="clist">${D.commits.map((x, i) => {
      const reasons = x.reasons.filter((r) => Math.abs(r.effect_pts) >= 0.5).slice(0, 4);
      const ok = (x.risk >= 0.5) === x.buggy;
      return `<div class="commit ${i >= 4 ? "hidden extra" : ""}">
        <div class="top"><div class="risk ${lvl(x.risk)}">${pct(x.risk)}</div><div><div class="t">${esc(x.title)}</div>
          <div class="p">${esc(x.project.replace("apache/", ""))} · ${x.date} · +${x.la} −${x.ld} · ${x.nf} file${x.nf === 1 ? "" : "s"}</div></div></div>
        <div class="d"><div class="why">${reasons.map((r) => `<div><span>${esc(r.label)}</span><span class="${r.effect_pts > 0 ? "up" : "dn"}">${r.effect_pts > 0 ? "+" : ""}${r.effect_pts.toFixed(1)} pts</span></div>`).join("")}</div>
          <button class="reveal" type="button">Reveal what happened</button>
          <div class="truth ${x.buggy ? "bug" : "ok"}">${x.buggy ? "<b>Introduced a bug.</b> A later fix was traced back to it." : "<b>Stayed clean.</b>"}
            ${ok ? "The model got it right." : x.buggy ? "The model missed it." : "False alarm."} · <a href="https://github.com/${esc(x.project)}/commit/${esc(x.sha)}" target="_blank" rel="noopener">real commit ↗</a></div></div></div>`;
    }).join("")}</div>
    <button class="more" type="button" id="cmore">Show ${D.commits.length - 4} more commits</button>`;
  document.querySelectorAll("#clist .commit").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    if (e.target.closest(".reveal")) { el.querySelector(".truth").classList.add("show"); e.target.remove(); return; }
    if (e.target.closest(".d")) return;
    el.classList.toggle("open");
  }));
  $("#cmore").addEventListener("click", (e) => {
    const open = e.target.dataset.open === "1";
    document.querySelectorAll("#clist .extra").forEach((x) => x.classList.toggle("hidden", open));
    e.target.dataset.open = open ? "0" : "1";
    e.target.textContent = open ? `Show ${D.commits.length - 4} more commits` : "Show fewer";
  });
}

function details(D, Rs, F) {
  const m = D.models, FH = Rs.full_history, ab = F ? F.ablation : [];
  $("#details").innerHTML = `<h2>Under the hood</h2>
    <details><summary>How it works</summary><div class="body"><ol>
      <li><b>13 numbers per commit</b>, counted from git: size, files and modules touched, file history, author experience, plus 10 derived ratios and time of day.</li>
      <li><b>Labels from history:</b> a later fix commit is traced back with <i>git blame</i> (SZZ) to the commit that caused the bug. Fix dates show <i>when</i> each bug was found.</li>
      <li><b>Frozen network:</b> 23 inputs → 64 → 32 → risk (3,601 weights), trained from scratch in NumPy, then locked.</li>
      <li><b>Booster trees:</b> each round picks a weight matrix, takes its best update direction (SVD of the gradient), measures every commit's gradient and hessian along it, and grows a small tree. Each group gets its own Newton step −G/(H+λ).</li>
    </ol></div></details>
    <details><summary>The math of the fix</summary><div class="body">
      <p>For a commit with no bug found yet: p = risk, q = chance its bug would have surfaced by now (learned from older commits only).</p>
      <div class="formula">loss = −log(1 − p·q)

standard hessian:
 p(1−p)·q·(1−2p+p²q) / (1−p·q)²
 → can go NEGATIVE: breaks the Newton step

fix (Fisher, always positive):
 q·p·(1−p)² / (1−p·q)
 → = p(1−p) when q = 1 (plain boosting)</div>
      <p>Checked against numerical derivatives in the test suite.</p></div></details>
    <details><summary>Leakage &amp; honesty checks</summary><div class="body">
      <table><tr><th>Feature set</th><th class="n">Test AUC</th></tr>${ab.map((a) => `<tr><td>${esc(a.set)}</td><td class="n">${a.test_auc.toFixed(3)}</td></tr>`).join("")}</table>
      <p>Project identity was removed: a per-project shortcut that won't transfer to a new repo. All splits are by time; scaling fitted on training years only.</p>
      <p>Ours still sits below the future-label ceiling. With 10+ years of history, delay barely changes ranking (AUC ${FH.naive.auc.toFixed(3)} plain vs ${FH["delay Fisher"].auc.toFixed(3)} ours) and mainly corrects the predicted bug rate (log-loss ${FH.naive.logloss.toFixed(3)} → ${FH["delay Fisher"].logloss.toFixed(3)}). The raw hessian went negative for under 1% of commits, so the Fisher fix is a safety guarantee more than a score booster here.</p></div></details>
    <details><summary>Overall model scores</summary><div class="body">
      <table><tr><th>Ranking 2017–2019 commits</th><th class="n">AUC</th><th class="n">Top 20%</th></tr>
        <tr><td>Boosted trees (from scratch)</td><td class="n">${m.ours.auc.toFixed(3)}</td><td class="n">${pct(m.ours.recall_top20)}</td></tr>
        <tr><td>Rule: biggest commits first</td><td class="n">${m.lines_added_rule.auc.toFixed(3)}</td><td class="n">${pct(m.lines_added_rule.recall_top20)}</td></tr>
        <tr><td>Random</td><td class="n">0.500</td><td class="n">20%</td></tr></table>
      <p>Engine check: scikit-learn's boosting on the same split scores ${m.sklearn_hgb_reference ? m.sklearn_hgb_reference.auc.toFixed(3) : "—"}.</p></div></details>`;
}

Promise.all(["data.json", "research.json", "dash.json", "frozen.json"].map((f) => fetch(f).then((r) => r.json()).catch(() => null)))
  .then(([D, Rs, Dash, F]) => {
    kpis(D, Rs); compare(Rs); trends(Dash, D); samples(Dash); commits(D); details(D, Rs, F);
    $("#foot").innerHTML = `Data: <a href="https://arxiv.org/abs/2203.00101">ApacheJIT</a>, 106,674 real commits from 15 Apache projects, with SZZ labels and real fix dates (SZZ labels are somewhat noisy). Built by Hari · <a href="https://github.com/Harimhs/boostree-model">source</a>`;
  });
</script>
</body>
