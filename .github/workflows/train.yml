name: Train

# Step 2: retrain the baselines on all issues collected so far, every 3 hours.
# Results go to the `data` branch (model/...) and show on the dashboard.
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
  push:
    branches: [code]
    paths:
      - "src/boostree/model/**"
      - "tests/test_model*.py"
      - "requirements-model.txt"
      - ".github/workflows/train.yml"

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: src
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU-only PyTorch keeps this small and fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-model.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Train and evaluate baselines
        run: |
          mkdir -p data-branch/model
          python -m boostree.model.baseline \
            --out data-branch/model/latest_baseline.json \
            --history data-branch/model/model_history.jsonl
          {
            echo "## Baseline results"
            echo '```json'
            cat data-branch/model/latest_baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Train booster trees (step 3)
        run: |
          python -m boostree.model.train_boost \
            --out data-branch/model/latest_boost.json \
            --history data-branch/model/boost_history.jsonl \
            --max-rounds 12 --max-minutes 150
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("data-branch/model/latest_boost.json"))
          print("## Booster trees")
          if d.get("status") != "ok":
              print(d.get("status"))
          else:
              print(f"Start macro-F1: {d['start']['macro_f1']:.3f} -> after boosting: {d['final']['macro_f1']:.3f}")
              print(f"Boosters kept: {d['boosters']}. Stopped because: {d['stopped_because']}")
              for r in d["rounds"]:
                  if "module" in r:
                      rules = "; ".join(f"{l['rule']} -> {l['weight']}" for l in r["leaves"])
                      print(f"- Round {r['round']}: {r['module']} (gain {r['gain']}, t {r['t']}): {rules}")
          EOF

      - name: Publish to the data branch (feeds the dashboard)
        run: bash scripts/push_data_branch.sh data-branch "Train run ${{ github.run_number }}"
